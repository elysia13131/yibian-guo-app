name = "智能学习平台"
region = "sgp1"

[services.api]
name = "backend"
source = "upload"
type = "python"
directory = "."

[services.api.env]
PORT = "8080"
ENVIRONMENT = "production"
DEEPSEEK_API_KEYS_STR = "你的 DeepSeek API Key，多个用逗号分隔"
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
DATABASE_URL = "sqlite:///./learning.db"
CORS_ORIGINS = "http://localhost:5173,capacitor://localhost"
HF_ENDPOINT = "https://mirrors.cloud.tencent.com/huggingface/"
REMBG_SERVICE_URL = "http://rembg-service-1.zeabur.internal:8081"

[services.api.run]
command = "bash .zeabur/install_deps.sh && uvicorn main:app --host 0.0.0.0 --port 8080"
